<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Cekrek — Secure Upload</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            animation: scaleUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        h2 {
            margin: 0 0 6px 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0 0 32px 0;
        }

        .upload-area {
            position: relative;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.01);
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.04);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
        }

        .icon-box {
            width: 54px;
            height: 54px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            font-size: 22px;
            transition: transform 0.3s ease;
        }

        .upload-area:hover .icon-box {
            transform: translateY(-4px);
            background: var(--accent);
            border-color: var(--accent);
        }

        .upload-text {
            font-size: 14px;
            font-weight: 500;
        }

        .upload-subtext {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .preview-box {
            margin-top: 24px;
            border-radius: 16px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            display: none;
            overflow: hidden;
        }

        .preview-box img {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 10px;
            display: block;
        }

        .file-meta {
            font-size: 12px;
            color: var(--text-secondary);
            padding: 10px 6px 4px 6px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        button[type="submit"] {
            font-family: inherit;
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 24px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        button[type="submit"]:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--accent-glow);
            filter: brightness(1.1);
        }

        .nav-footer {
            margin-top: 24px;
            text-align: center;
        }

        .link {
            font-size: 13px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
            font-weight: 500;
        }

        .link:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Cloud Cekrek</h2>
    <p class="subtitle">Unggah & amankan aset portofolio digital Anda</p>

    <form action="upload.php" method="post" enctype="multipart/form-data">
        <div class="upload-area">
            <div class="icon-box">✦</div>
            <div class="upload-text" id="statusText">Pilih berkas yang ingin diunggah</div>
            <div class="upload-subtext">JPG, PNG, GIF hingga ukuran 500KB</div>
            <input type="file" name="fileToUpload" id="fileToUpload" accept="image/*" required>
        </div>

        <div class="preview-box" id="previewWrapper">
            <img id="imgRender" src="" alt="Pratinjau">
            <div class="file-meta" id="metaInfo"></div>
        </div>

        <button type="submit" name="submit">Unggah Komponen</button>
    </form>
    
    <div class="nav-footer">
        <a href="files.php" class="link">Buka Repositori Berkas yang sudah diunggah →</a>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileToUpload');
    const previewWrapper = document.getElementById('previewWrapper');
    const imgRender = document.getElementById('imgRender');
    const statusText = document.getElementById('statusText');
    const metaInfo = document.getElementById('metaInfo');

    fileInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            statusText.textContent = "Berkas Siap";
            metaInfo.textContent = `${file.name} • ${(file.size / 1024).toFixed(1)} KB`;

            const reader = new FileReader();
            reader.onload = function(e) {
                imgRender.setAttribute('src', e.target.result);
                previewWrapper.style.display = 'block';
            }
            reader.readAsDataURL(file);
        } else {
            statusText.textContent = "Pilih berkas citra";
            previewWrapper.style.display = 'none';
        }
    });
</script>

</body>
</html>
